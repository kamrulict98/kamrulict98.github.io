name: Patch admin analytics

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[analytics-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch dashboard safely
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('admin/dashboard.html')
          text = p.read_text(encoding='utf-8')

          # Fix the login-time TypeError: matchFrom() was receiving a match-array
          # from buildContact(), not the matched string.
          old = "function matchFrom(s,re){const m=s.match(re);return m?m[1].trim():''}"
          new = "function matchFrom(s,re){const t=typeof s==='string'?s:String(s??'');const m=t.match(re);return m?m[1].trim():''}"
          if old in text:
              text = text.replace(old, new, 1)

          # Also make buildContact explicitly pass the full matched string.
          old_contact = "rows.map(c=>`<div class=\\\"card contact-row\\\"><div class=\\\"grid\\\"><div class=\\\"field\\\"><label>Label</label><input value=\\\"${esc(matchFrom(c,/class=\\\"lbl\\\">([\\s\\S]*?)<\\\\/div>/))}\\\"></div>"
          # The defensive matchFrom() above is sufficient even if this exact text changes.

          # Add the Analytics navigation item without changing existing items.
          nav_marker = '<button class="nav" data-p="backup">Backup</button>'
          nav_button = '<button class="nav" data-p="analytics">Analytics</button>'
          if 'data-p="analytics"' not in text and nav_marker in text:
              text = text.replace(nav_marker, nav_button + '\n' + nav_marker, 1)

          # Add an Analytics page before Backup. It stores the GoatCounter token only
          # in sessionStorage and never writes the token into GitHub.
          section_marker = '<section id="backup" class="page">'
          analytics = r'''<section id="analytics" class="page"><h1>Analytics</h1><p class="sub">Privacy-friendly portfolio analytics powered by GoatCounter.</p>
          <div class="card"><h2>GoatCounter connection</h2><div class="grid"><div class="field"><label>GoatCounter site code</label><input id="gcCode" placeholder="your-site-code"></div><div class="field"><label>GoatCounter API token</label><input id="gcToken" type="password" placeholder="Paste API token"></div></div><div class="actions"><button class="btn primary" onclick="gcConnect()">Connect / Save</button><button class="btn dark" onclick="gcRefresh()">Refresh Analytics</button><button class="btn light" onclick="gcOpen()">Open GoatCounter</button><button class="btn danger" onclick="gcClear()">Clear Token</button></div><p id="gcStatus" class="small" style="margin-top:12px">Not connected.</p></div>
          <div class="stats"><div class="stat"><b id="gcVisitors">—</b><small>Total visitors (30 days)</small></div><div class="stat"><b id="gcViews">—</b><small>Page views (30 days)</small></div><div class="stat"><b id="gcCv">—</b><small>CV download events</small></div><div class="stat"><b id="gcPages">—</b><small>Tracked pages</small></div></div>
          <div class="card"><h2>Most visited pages</h2><table><thead><tr><th>Page / event</th><th>Visitors</th></tr></thead><tbody id="gcRows"><tr><td colspan="2" class="small">Connect GoatCounter to load statistics.</td></tr></tbody></table></div>
          <div class="card"><div class="warn">Create your API key in GoatCounter: <b>Username → API → Create API key</b>. The key is kept only in this browser session. It is not committed to GitHub.</div></div></section>
          <script>
          const GC_STORE='kamrul.goatcounter';
          function gcCfg(){try{return JSON.parse(sessionStorage.getItem(GC_STORE)||'{}')}catch{return {}}}
          function gcSave(){const code=$('gcCode').value.trim().replace(/^https?:\\/\\//,'').replace(/\\.goatcounter\\.com.*$/,'');const token=$('gcToken').value.trim();if(!code||!token){note('Enter GoatCounter site code and API token.',true);return null}const c={code,token};sessionStorage.setItem(GC_STORE,JSON.stringify(c));return c}
          function gcBase(c){return 'https://'+c.code+'.goatcounter.com/api/v0'}
          async function gcApi(path,c){const r=await fetch(gcBase(c)+path,{headers:{Authorization:'Bearer '+c.token,Accept:'application/json','Content-Type':'application/json'}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||d.message||('GoatCounter HTTP '+r.status));return d}
          function gcSafe(v){return String(v??'').replace(/[&<>\"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[x]))}
          function gcRange(){const end=new Date();const start=new Date(end.getTime()-30*86400000);const z=d=>d.toISOString().slice(0,13)+':00:00Z';return {start:z(start),end:z(end)}}
          async function gcRefresh(){const c=gcCfg();if(!c.code||!c.token){note('Enter GoatCounter site code and API token first.',true);return}try{$('gcStatus').textContent='Loading…';const r=gcRange();const [total,hits]=await Promise.all([gcApi('/stats/total?start='+encodeURIComponent(r.start)+'&end='+encodeURIComponent(r.end),c),gcApi('/stats/hits?start='+encodeURIComponent(r.start)+'&end='+encodeURIComponent(r.end)+'&limit=100',c)]);$('gcVisitors').textContent=total.total??total.count??'0';const rows=hits.hits||[];let views=0,cv=0;rows.forEach(x=>{const n=Number(x.count||0);views+=n;if(x.event&&String(x.path||'').toLowerCase()==='cv-download')cv+=n});$('gcViews').textContent=views;$('gcCv').textContent=cv;$('gcPages').textContent=rows.length;$('gcRows').innerHTML=rows.slice(0,30).map(x=>'<tr><td>'+gcSafe(x.event?'Event: '+x.path:x.path)+'</td><td>'+gcSafe(x.count)+'</td></tr>').join('')||'<tr><td colspan="2" class="small">No statistics yet.</td></tr>';$('gcStatus').textContent='Connected • updated '+new Date().toLocaleString()}catch(e){$('gcStatus').textContent='Connection failed: '+e.message;note(e.message,true)}}
          function gcConnect(){const c=gcSave();if(c){$('gcToken').value=c.token;gcRefresh()}}
          function gcClear(){sessionStorage.removeItem(GC_STORE);$('gcToken').value='';$('gcStatus').textContent='Token cleared.';note('GoatCounter token cleared from this browser.')}
          function gcOpen(){const c=gcCfg();window.open(c.code?'https://'+c.code+'.goatcounter.com':'https://www.goatcounter.com','_blank','noopener')}
          (function(){const c=gcCfg();if(c.code){$('gcCode').value=c.code;$('gcToken').value=c.token||'';if(c.token)gcRefresh()}})();
          </script>
          '''
          if 'id="analytics" class="page"' not in text and section_marker in text:
              text = text.replace(section_marker, analytics + '\n' + section_marker, 1)

          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit patched dashboard
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin/dashboard.html
          git commit -m "[analytics-patch] Add dashboard analytics and fix login error" || exit 0
          git push
