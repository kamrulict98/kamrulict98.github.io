<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kamrul Admin Upload Center</title><style>body{font-family:Arial;background:#f4f7f8;margin:0;color:#243746}.box{max-width:850px;margin:35px auto;padding:24px;background:#fff;border-radius:14px;box-shadow:0 10px 35px #0001}h1{color:#0f2942}.card{border:1px solid #d7e0e5;border-radius:12px;padding:18px;margin:18px 0}.btn{border:0;border-radius:8px;padding:11px 16px;cursor:pointer;font-weight:700;background:#0d9488;color:#fff}.muted{color:#6b7a89}input{padding:10px;width:100%;box-sizing:border-box;margin:7px 0 14px}.row{display:flex;gap:10px;flex-wrap:wrap}.status{padding:12px;border-radius:8px;background:#edf8f6;margin-top:12px;white-space:pre-wrap}.err{background:#fff0ee;color:#c0392b}</style></head><body><div class="box"><h1>Kamrul Portfolio — Upload Center</h1><p class="muted">Repair uploader: handles new files and existing filenames correctly.</p><div class="card"><label>GitHub Personal Access Token</label><input id="token" type="password" placeholder="github_pat_..."><label>Repository</label><input id="repo" value="kamrulict98/kamrulict98.github.io"><button class="btn" onclick="connect()">Connect</button><div id="status"></div></div><div id="tools" style="display:none"><div class="card"><h2>Photos</h2><input id="photos" type="file" multiple accept="image/jpeg,image/png,image/webp,image/gif"><div class="row"><button class="btn" onclick="uploadPhotos()">Upload / Replace Photos</button><button class="btn" onclick="listPhotos()">Refresh</button></div><div id="photoList"></div></div><div class="card"><h2>CV</h2><input id="cv" type="file" accept="application/pdf"><button class="btn" onclick="uploadCV()">Upload / Replace CV</button><div id="cvList"></div></div></div></div><script>let token='',repo='';const $=id=>document.getElementById(id);function setStatus(m,e=false){$('status').textContent=m;$('status').className='status'+(e?' err':'')}function h(){return{Accept:'application/vnd.github+json',Authorization:'Bearer '+token,'X-GitHub-Api-Version':'2022-11-28'}}async function api(path,opt={}){const r=await fetch('https://api.github.com'+path,{...opt,headers:{...h(),...(opt.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.message||('GitHub API '+r.status));return d}async function connect(){token=$('token').value.trim();repo=$('repo').value.trim();try{await api('/repos/'+repo);sessionStorage.setItem('k_token',token);sessionStorage.setItem('k_repo',repo);$('tools').style.display='block';setStatus('Connected.');await listPhotos();await listCV()}catch(e){setStatus(e.message,true)}}async function b64(f){return new Promise((ok,no)=>{let r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=no;r.readAsDataURL(f)})}async function uploadPhotos(){let fs=[...$('photos').files];if(!fs.length)return setStatus('Choose image files first.',true);try{for(let f of fs){let path='photos/'+f.name;let old=null;try{old=await api('/repos/'+repo+'/contents/'+path+'?ref=main')}catch(e){if(!String(e.message).includes('404'))throw e}let body={message:(old?'Replace ':'Add ')+'photo '+f.name,content:await b64(f),branch:'main'};if(old)body.sha=old.sha;await api('/repos/'+repo+'/contents/'+path,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})}$('photos').value='';setStatus('Photo upload completed successfully.');await listPhotos()}catch(e){setStatus('Upload failed: '+e.message,true)}}async function listPhotos(){try{let fs=await api('/repos/'+repo+'/contents/photos?ref=main');$('photoList').innerHTML=fs.filter(x=>x.type==='file').map(x=>'<p>'+x.name+' — '+Math.round((x.size||0)/1024)+' KB</p>').join('')||'<p>No photos.</p>'}catch(e){setStatus(e.message,true)}}async function uploadCV(){let f=$('cv').files[0];if(!f)return setStatus('Choose a PDF first.',true);if(f.type!=='application/pdf')return setStatus('Only PDF is allowed.',true);try{let fs=await api('/repos/'+repo+'/contents?ref=main');for(let x of fs.filter(x=>x.type==='file'&&/\.pdf$/i.test(x.name)))await api('/repos/'+repo+'/contents/'+encodeURIComponent(x.name),{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:'Remove old CV '+x.name,sha:x.sha,branch:'main'})});await api('/repos/'+repo+'/contents/Md_Kamrul_Islam_CV.pdf',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:'Upload new CV',content:await b64(f),branch:'main'})});$('cv').value='';setStatus('CV uploaded successfully.');await listCV()}catch(e){setStatus('CV upload failed: '+e.message,true)}}async function listCV(){try{let fs=await api('/repos/'+repo+'/contents?ref=main');let x=fs.find(x=>x.type==='file'&&/\.pdf$/i.test(x.name));$('cvList').innerHTML=x?'<p>'+x.name+' — '+Math.round((x.size||0)/1024)+' KB</p>':'<p>No CV.</p>'}catch(e){setStatus(e.message,true)}}</script></body></html>
