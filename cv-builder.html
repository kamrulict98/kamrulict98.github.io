<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>CV Builder</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f3f6f8;color:#263746}*{box-sizing:border-box}.top{background:#0f2942;color:white;padding:18px 24px}.top-inner{max-width:1200px;margin:auto;display:flex;justify-content:space-between}.top a{color:white}.layout{max-width:1200px;margin:28px auto;padding:0 18px;display:grid;grid-template-columns:430px 1fr;gap:24px}.panel,.preview-shell{background:white;border:1px solid #ccd7de;border-radius:12px;padding:22px}.steps{display:flex;gap:6px;overflow:auto;margin-bottom:20px}.step{border:1px solid #ccd7de;background:#f7f9fa;border-radius:20px;padding:7px 11px;font-size:11px}.active{background:#0d9488;color:white}.form-step{display:none}.form-step.active{display:block}.field{margin-bottom:12px}.field label{display:block;font-size:12px;font-weight:600;margin-bottom:5px}.field input,.field textarea{width:100%;padding:10px;border:1px solid #bccbd4;border-radius:7px}.field textarea{min-height:80px}.repeat-item{border:1px solid #d7e0e5;border-radius:9px;padding:13px;margin-bottom:10px}.repeat-head{display:flex;justify-content:space-between;margin-bottom:10px}.mini-btn,.btn{padding:9px 13px;border:1px solid #ccd7de;border-radius:7px;background:white}.danger{color:#b33a32}.add-btn{width:100%;padding:10px;border:1px dashed #0d9488;background:#f2fbfa;color:#08786e;border-radius:7px}.primary{background:#0f2942;color:white}.green{background:#0d9488;color:white}.actions{display:flex;gap:8px;margin-top:20px}.cv-page{max-width:794px;min-height:1123px;margin:auto;padding:45px 48px;background:white}.cv-head{display:grid;grid-template-columns:105px 1fr;gap:24px;border-bottom:2px solid #0d9488;padding-bottom:24px}.cv-photo{width:105px;height:105px;border-radius:50%;object-fit:cover;border:3px solid #0d9488}.cv-name{font:700 31px Georgia,serif}.cv-role,.cv-org{color:#0b7c72;font-weight:600}.cv-contact,.cv-desc,.cv-summary{font-size:11px;color:#526473}.cv-section{margin-top:20px}.cv-section h2{font:700 15px Georgia,serif;border-bottom:1px solid #d6e0e5;padding-bottom:5px}.cv-item{margin-bottom:10px}.cv-item-top{display:flex;justify-content:space-between}.cv-date{font-size:10px;color:#6b7a89}.cv-tags{display:flex;gap:5px;flex-wrap:wrap}.cv-tag{font-size:10px;border:1px solid #ccd7de;border-radius:999px;padding:3px 8px}@media(max-width:900px){.layout{grid-template-columns:1fr}}@media print{.top,.panel,.preview-bar{display:none}.layout{display:block;padding:0}.preview-shell{border:0}.cv-page{max-width:none}}</style></head><body><header class="top"><div class="top-inner"><h2>CV Builder</h2><a href="./">← Portfolio</a></div></header><main class="layout"><section class="panel"><div class="steps" id="steps"></div><form><div class="form-step active"><h2>Personal Information</h2><div class="field"><label>Full Name</label><input id="name"></div><div class="field"><label>Professional Title</label><input id="role"></div><div class="field"><label>Headline / Field</label><input id="headline"></div><div class="field"><label>Phone</label><input id="phone"></div><div class="field"><label>Email</label><input id="email"></div><div class="field"><label>Location</label><input id="location"></div><div class="field"><label>Profile Photo</label><input id="photo" type="file" accept="image/*"></div></div><div class="form-step"><h2>Profile Summary</h2><div class="field"><label>Summary</label><textarea id="summary"></textarea></div><div class="field"><label>Career Objective</label><textarea id="objective"></textarea></div></div><div class="form-step"><h2>Education</h2><div id="educationList"></div><button type="button" class="add-btn" onclick="addEducation()">+ Add Education</button></div><div class="form-step"><h2>Experience</h2><div id="experienceList"></div><button type="button" class="add-btn" onclick="addExperience()">+ Add Experience</button></div><div class="form-step"><h2>Skills</h2><div class="field"><label>Skills (comma separated)</label><textarea id="skills"></textarea></div><div class="field"><label>Certifications</label><textarea id="certifications"></textarea></div></div><div class="form-step"><h2>Projects</h2><div id="projectList"></div><button type="button" class="add-btn" onclick="addProject()">+ Add Project</button></div><div class="form-step"><h2>Languages</h2><div id="languageList"></div><button type="button" class="add-btn" onclick="addLanguage()">+ Add Language</button></div><div class="form-step"><h2>Links & Finish</h2><div id="linkList"></div><button type="button" class="add-btn" onclick="addLink()">+ Add Link</button><div class="field"><label>CV File Name</label><input id="fileName" value="My_CV"></div></div><div class="actions"><button type="button" class="btn" id="prev">Previous</button><button type="button" class="btn primary" id="next">Next</button><button type="button" class="btn green" id="download">Download CV PDF</button></div></form></section><section class="preview-shell"><div class="preview-bar"><strong>Live Preview</strong><button class="btn" onclick="downloadPDF()">Download PDF</button></div><div id="cvPreview" class="cv-page"></div></section></main><script>const steps=['Personal','Summary','Education','Experience','Skills','Projects','Languages','Links'];let current=0,photoData='';const $=x=>document.getElementById(x),esc=s=>String(s||'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));function stepUI(){$$('.form-step').forEach((x,i)=>x.classList.toggle('active',i===current));$('steps').innerHTML=steps.map((x,i)=>`<button type="button" class="step ${i===current?'active':''}" onclick="go(${i})">${i+1}. ${x}</button>`).join('');$('prev').style.visibility=current?'visible':'hidden';$('next').style.display=current<7?'inline-block':'none'}function $$(s){return document.querySelectorAll(s)}function go(n){current=Math.max(0,Math.min(7,n));stepUI();render()}$('prev').onclick=()=>go(current-1);$('next').onclick=()=>go(current+1);$('download').onclick=downloadPDF;function addEducation(v={}){let d=document.createElement('div');d.className='repeat-item';d.innerHTML=`<div class="repeat-head"><b>Education</b><button type="button" class="mini-btn danger" onclick="this.closest('.repeat-item').remove();render()">Remove</button></div><div class="field"><label>Degree</label><input class="edu-degree" value="${esc(v.degree)}"></div><div class="field"><label>Department / Discipline</label><input class="edu-dept" value="${esc(v.dept)}"></div><div class="field"><label>Institution</label><input class="edu-inst" value="${esc(v.inst)}"></div><div class="field"><label>Year</label><input class="edu-year" value="${esc(v.year)}"></div>`;$('educationList').appendChild(d)}function addExperience(v={}){let d=document.createElement('div');d.className='repeat-item';d.innerHTML=`<div class="repeat-head"><b>Experience</b><button type="button" class="mini-btn danger" onclick="this.closest('.repeat-item').remove();render()">Remove</button></div><div class="field"><label>Job Title</label><input class="exp-title" value="${esc(v.title)}"></div><div class="field"><label>Organization</label><input class="exp-org" value="${esc(v.org)}"></div><div class="field"><label>Period</label><input class="exp-period" value="${esc(v.period)}"></div><div class="field"><label>Description</label><textarea class="exp-desc">${esc(v.desc)}</textarea></div>`;$('experienceList').appendChild(d)}function addProject(v={}){let d=document.createElement('div');d.className='repeat-item';d.innerHTML=`<div class="repeat-head"><b>Project</b><button type="button" class="mini-btn danger" onclick="this.closest('.repeat-item').remove();render()">Remove</button></div><div class="field"><label>Project Name</label><input class="pro-name" value="${esc(v.name)}"></div><div class="field"><label>Description</label><textarea class="pro-desc">${esc(v.desc)}</textarea></div><div class="field"><label>Technologies / Tags</label><input class="pro-tags" value="${esc(v.tags)}"></div>`;$('projectList').appendChild(d)}function addLanguage(v={}){let d=document.createElement('div');d.className='repeat-item';d.innerHTML=`<div class="repeat-head"><b>Language</b><button type="button" class="mini-btn danger" onclick="this.closest('.repeat-item').remove();render()">Remove</button></div><div class="field"><label>Language</label><input class="lang-name" value="${esc(v.name)}"></div><div class="field"><label>Proficiency</label><input class="lang-level" value="${esc(v.level)}"></div>`;$('languageList').appendChild(d)}function addLink(v={}){let d=document.createElement('div');d.className='repeat-item';d.innerHTML=`<div class="repeat-head"><b>Link</b><button type="button" class="mini-btn danger" onclick="this.closest('.repeat-item').remove();render()">Remove</button></div><div class="field"><label>Label</label><input class="link-label" value="${esc(v.label)}"></div><div class="field"><label>URL</label><input class="link-url" value="${esc(v.url)}"></div>`;$('linkList').appendChild(d)}function render(){let edu=[...document.querySelectorAll('#educationList .repeat-item')].map(x=>({degree:x.querySelector('.edu-degree').value,dept:x.querySelector('.edu-dept').value,inst:x.querySelector('.edu-inst').value,year:x.querySelector('.edu-year').value}));$('cvPreview').innerHTML=`<div class="cv-head">${photoData?`<img class="cv-photo" src="${photoData}">`:'<div class="cv-photo"></div>'}<div><div class="cv-kicker">${esc($('headline').value||'Professional Curriculum Vitae')}</div><div class="cv-name">${esc($('name').value||'Your Name')}</div><div class="cv-role">${esc($('role').value)}</div><div class="cv-contact">${[$('phone').value,$('email').value,$('location').value].filter(Boolean).map(esc).join(' · ')}</div></div></div>${$('summary').value?`<div class="cv-section"><h2>PROFILE SUMMARY</h2><div class="cv-summary">${esc($('summary').value)}</div></div>`:''}${$('objective').value?`<div class="cv-section"><h2>CAREER OBJECTIVE</h2><div class="cv-summary">${esc($('objective').value)}</div></div>`:''}<div class="cv-section"><h2>EDUCATION</h2>${edu.map(x=>`<div class="cv-item"><div class="cv-item-top"><h3>${esc(x.degree)}</h3><span class="cv-date">${esc(x.year)}</span></div><div class="cv-org">${esc(x.dept)}${x.dept&&x.inst?' · ':''}${esc(x.inst)}</div></div>`).join('')}</div>`}document.addEventListener('input',render);$('photo').onchange=e=>{let r=new FileReader();r.onload=()=>{photoData=r.result;render()};if(e.target.files[0])r.readAsDataURL(e.target.files[0])};async function loadPDFLib(){if(window.html2pdf)return true;for(const src of ['https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js','https://unpkg.com/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js']){try{await new Promise((resolve,reject)=>{let s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=reject;document.head.appendChild(s)});if(window.html2pdf)return true}catch(e){}}return false}async function downloadPDF(){render();let ok=await loadPDFLib();if(ok){let name=(($('fileName').value||'My_CV').replace(/\.pdf$/i,'')+'.pdf');try{await html2pdf().set({margin:0,filename:name,image:{type:'jpeg',quality:.98},html2canvas:{scale:2,useCORS:true,backgroundColor:'#ffffff'},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'}}).from($('cvPreview')).save();return}catch(e){}}window.print()}addEducation();addExperience();addProject();addLanguage();addLink();stepUI();render();</script></body></html>
